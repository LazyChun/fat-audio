<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乐谱编辑器 — AI Music Studio</title>
    <style id="theme-vars">
:root {
  /* === Brand Prefix: ams (AI Music Studio) — Light Theme === */

  /* === Color System === */
  --ams-bg-deep: #f5f5f8;
  --ams-bg-primary: #ffffff;
  --ams-bg-secondary: #f0f0f4;
  --ams-bg-tertiary: #e8e8ee;
  --ams-bg-elevated: #ffffff;
  --ams-bg-hover: #ececf2;
  --ams-bg-active: #e2e2ea;

  --ams-border-subtle: rgba(0, 0, 0, 0.06);
  --ams-border-default: rgba(0, 0, 0, 0.1);
  --ams-border-strong: rgba(0, 0, 0, 0.16);
  --ams-border-focus: rgba(99, 102, 241, 0.5);

  --ams-text-primary: #1a1a2e;
  --ams-text-secondary: #5a5a72;
  --ams-text-tertiary: #9a9ab0;
  --ams-text-inverse: #ffffff;

  --ams-brand-primary: #6366f1;
  --ams-brand-primary-hover: #4f46e5;
  --ams-brand-primary-muted: rgba(99, 102, 241, 0.08);
  --ams-brand-primary-glow: rgba(99, 102, 241, 0.12);

  --ams-accent-warm: #d97706;
  --ams-accent-warm-muted: rgba(217, 119, 6, 0.08);

  --ams-accent-cyan: #0891b2;
  --ams-accent-cyan-muted: rgba(8, 145, 178, 0.08);

  --ams-accent-rose: #e11d48;
  --ams-accent-rose-muted: rgba(225, 29, 72, 0.08);

  --ams-accent-emerald: #059669;
  --ams-accent-emerald-muted: rgba(5, 150, 105, 0.08);

  /* Semantic State Colors */
  --state-success: #059669;
  --state-warning: #d97706;
  --state-error: #dc2626;
  --state-info: #6366f1;

  /* Piano Roll / Grid Colors */
  --ams-grid-line: rgba(0, 0, 0, 0.04);
  --ams-grid-beat: rgba(0, 0, 0, 0.07);
  --ams-grid-measure: rgba(0, 0, 0, 0.12);
  --ams-note-c: #6366f1;
  --ams-note-d: #818cf8;
  --ams-note-e: #0891b2;
  --ams-note-f: #059669;
  --ams-note-g: #d97706;
  --ams-note-a: #e11d48;
  --ams-note-b: #7c3aed;

  /* Track Colors */
  --ams-track-piano: #6366f1;
  --ams-track-drums: #d97706;
  --ams-track-guitar: #059669;
  --ams-track-bass: #0891b2;
  --ams-track-violin: #e11d48;
  --ams-track-synth: #7c3aed;
  --ams-track-vocals: #db2777;
  --ams-track-strings: #ea580c;
  --ams-track-winds: #0d9488;
  --ams-track-organ: #6d28d9;

  /* === Typography === */
  --ams-font-display: 'Inter', system-ui, -apple-system, sans-serif;
  --ams-font-body: 'Inter', system-ui, -apple-system, sans-serif;
  --ams-font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;

  --ams-text-xs: 0.6875rem;
  --ams-text-sm: 0.75rem;
  --ams-text-base: 0.8125rem;
  --ams-text-md: 0.875rem;
  --ams-text-lg: 1rem;
  --ams-text-xl: 1.125rem;
  --ams-text-2xl: 1.25rem;
  --ams-text-3xl: 1.5rem;

  --ams-leading-tight: 1.25;
  --ams-leading-normal: 1.5;
  --ams-leading-relaxed: 1.625;

  --ams-weight-normal: 400;
  --ams-weight-medium: 500;
  --ams-weight-semibold: 600;
  --ams-weight-bold: 700;

  --ams-tracking-tight: -0.01em;
  --ams-tracking-normal: 0;
  --ams-tracking-wide: 0.02em;

  /* === Radius === */
  --radius-sm: 3px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 9999px;

  /* === Spacing === */
  --ams-space-1: 4px;
  --ams-space-2: 8px;
  --ams-space-3: 12px;
  --ams-space-4: 16px;
  --ams-space-5: 20px;
  --ams-space-6: 24px;
  --ams-space-8: 32px;
  --ams-space-10: 40px;
  --ams-space-12: 48px;

  /* === Shadow / Surface === */
  --ams-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --ams-shadow-md: 0 2px 8px rgba(0, 0, 0, 0.05);
  --ams-shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.05);
  --ams-shadow-xl: 0 8px 32px rgba(0, 0, 0, 0.05);
  --ams-glow-primary: 0 0 12px rgba(99, 102, 241, 0.15);
  --ams-glow-warm: 0 0 12px rgba(217, 119, 6, 0.15);

  /* === Z-index layers === */
  --ams-z-sidebar: 100;
  --ams-z-panel: 200;
  --ams-z-modal: 300;
  --ams-z-popover: 400;
  --ams-z-tooltip: 500;

  /* === Transitions === */
  --ams-transition-fast: 100ms ease;
  --ams-transition-normal: 200ms ease;
  --ams-transition-slow: 350ms ease;

  /* === Light mode base === */
  --ams-theme-mode: light;
}

.ams-body {
  font-family: var(--ams-font-body);
  font-size: var(--ams-text-base);
  line-height: var(--ams-leading-normal);
  color: var(--ams-text-primary);
  background-color: var(--ams-bg-deep);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.ams-display {
  font-family: var(--ams-font-display);
  font-weight: var(--ams-weight-bold);
  letter-spacing: var(--ams-tracking-tight);
}

.ams-mono {
  font-family: var(--ams-font-mono);
  letter-spacing: 0.02em;
}

.ams-h1 {
  font-family: var(--ams-font-display);
  font-size: var(--ams-text-3xl);
  font-weight: var(--ams-weight-bold);
  line-height: var(--ams-leading-tight);
  letter-spacing: var(--ams-tracking-tight);
  color: var(--ams-text-primary);
}

.ams-h2 {
  font-family: var(--ams-font-display);
  font-size: var(--ams-text-2xl);
  font-weight: var(--ams-weight-semibold);
  line-height: var(--ams-leading-tight);
  color: var(--ams-text-primary);
}

.ams-h3 {
  font-family: var(--ams-font-display);
  font-size: var(--ams-text-xl);
  font-weight: var(--ams-weight-semibold);
  line-height: var(--ams-leading-tight);
  color: var(--ams-text-primary);
}

.ams-body-lg {
  font-family: var(--ams-font-body);
  font-size: var(--ams-text-lg);
  line-height: var(--ams-leading-normal);
  color: var(--ams-text-primary);
}

.ams-body-md {
  font-family: var(--ams-font-body);
  font-size: var(--ams-text-md);
  line-height: var(--ams-leading-normal);
  color: var(--ams-text-secondary);
}

.ams-body-sm {
  font-family: var(--ams-font-body);
  font-size: var(--ams-text-sm);
  line-height: var(--ams-leading-normal);
  color: var(--ams-text-tertiary);
}

.ams-caption {
  font-family: var(--ams-font-mono);
  font-size: var(--ams-text-xs);
  line-height: var(--ams-leading-normal);
  color: var(--ams-text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  
  @layer base {
    body { background: var(--ams-bg-primary); color: var(--ams-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">

    <!-- ============================================================
         AI Music Studio — Score Editor Page
         Includes: project-shell.html + page-specific main content
         Active nav: score-editor
         ============================================================ -->

<div id="ams-app-shell" style="display:grid; grid-template-columns:1fr; grid-template-rows:44px 1fr 28px; grid-template-areas:'transport' 'main' 'status'; width:100vw; height:100vh; overflow:hidden; background:var(--ams-bg-deep); font-family:var(--ams-font-body); font-size:var(--ams-text-base); color:var(--ams-text-primary); -webkit-font-smoothing:antialiased;">

  

  
  <!-- ========== TOP TRANSPORT BAR (with integrated page nav) ========== -->
  <header id="ams-transport" style="grid-area:transport; height:44px; background:var(--ams-bg-primary); border-bottom:1px solid var(--ams-border-default); display:flex; align-items:center; padding:0 var(--ams-space-3); gap:var(--ams-space-3);">

    <!-- Left: Page Navigation Tabs -->
    <nav style="display:flex; align-items:center; gap:0; margin-right:var(--ams-space-2);">

      <!-- Logo -->
      <div style="display:flex; align-items:center; gap:4px; margin-right:var(--ams-space-3);">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="AMS Logo">
          <path d="M6 2v14a3 3 0 1 1-2-2.83V4.83A3 3 0 1 0 9 2V2" stroke="var(--ams-brand-primary)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="14" cy="5" r="2.5" stroke="var(--ams-brand-primary)" stroke-width="1.6"/>
        </svg>
        <span style="font-family:var(--ams-font-display); font-weight:700; font-size:var(--ams-text-sm); color:var(--ams-brand-primary); letter-spacing:0.04em;">AMS</span>
      </div>

      <!-- Nav: 主工作区 -->
      <button class="ams-nav-btn" data-nav-key="workspace" data-label="主工作区" data-dom-id="nav-main-workspace" style="position:relative; height:32px; display:flex; align-items:center; gap:5px; padding:0 10px; border:none; border-radius:var(--radius-md); background:transparent; color:var(--ams-text-tertiary); cursor:pointer; transition:background var(--ams-transition-fast), color var(--ams-transition-fast); font-size:var(--ams-text-sm); font-family:var(--ams-font-body);"
              onmouseenter="this.style.background='var(--ams-bg-hover)'" onmouseleave="if(!this.classList.contains('ams-nav-active'))this.style.background='transparent'">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="5" height="5" rx="1"/><rect x="11" y="2" width="5" height="5" rx="1"/>
          <rect x="2" y="11" width="14" height="5" rx="1"/>
        </svg>
        <span>主工作区</span>
      </button>

      <!-- Nav: AI 生成 -->
      <button class="ams-nav-btn" data-nav-key="ai-generate" data-label="AI 生成" data-dom-id="nav-ai-generate" style="position:relative; height:32px; display:flex; align-items:center; gap:5px; padding:0 10px; border:none; border-radius:var(--radius-md); background:transparent; color:var(--ams-text-tertiary); cursor:pointer; transition:background var(--ams-transition-fast), color var(--ams-transition-fast); font-size:var(--ams-text-sm); font-family:var(--ams-font-body);"
              onmouseenter="this.style.background='var(--ams-bg-hover)'" onmouseleave="if(!this.classList.contains('ams-nav-active'))this.style.background='transparent'">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 2l1.8 4.2L15 8l-4.2 1.8L9 14l-1.8-4.2L3 8l4.2-1.8z"/>
          <line x1="15" y1="15" x2="12" y2="12"/>
        </svg>
        <span>AI 生成</span>
      </button>

      <!-- Nav: 乐谱编辑 -->
      <button class="ams-nav-btn" data-nav-key="score-editor" data-label="乐谱编辑" data-dom-id="nav-score-editor" style="position:relative; height:32px; display:flex; align-items:center; gap:5px; padding:0 10px; border:none; border-radius:var(--radius-md); background:transparent; color:var(--ams-text-tertiary); cursor:pointer; transition:background var(--ams-transition-fast), color var(--ams-transition-fast); font-size:var(--ams-text-sm); font-family:var(--ams-font-body);"
              onmouseenter="this.style.background='var(--ams-bg-hover)'" onmouseleave="if(!this.classList.contains('ams-nav-active'))this.style.background='transparent'">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="4" x2="3" y2="14"/><line x1="6" y1="4" x2="6" y2="14"/>
          <line x1="9" y1="4" x2="9" y2="14"/><line x1="15" y1="4" x2="15" y2="14"/>
          <ellipse cx="3" cy="13" rx="2" ry="1.2" fill="currentColor" stroke="none" opacity="0.7"/>
          <ellipse cx="6" cy="11" rx="2" ry="1.2" fill="currentColor" stroke="none" opacity="0.7"/>
          <ellipse cx="9" cy="9" rx="2" ry="1.2" fill="currentColor" stroke="none" opacity="0.7"/>
          <line x1="2" y1="6" x2="16" y2="6" stroke-dasharray="2 2"/>
          <line x1="2" y1="9" x2="16" y2="9" stroke-dasharray="2 2"/>
          <line x1="2" y1="12" x2="16" y2="12" stroke-dasharray="2 2"/>
        </svg>
        <span>乐谱编辑</span>
      </button>

      <!-- Nav: 乐器音调 -->
      <button class="ams-nav-btn" data-nav-key="instruments" data-label="乐器音调" data-dom-id="nav-instruments" style="position:relative; height:32px; display:flex; align-items:center; gap:5px; padding:0 10px; border:none; border-radius:var(--radius-md); background:transparent; color:var(--ams-text-tertiary); cursor:pointer; transition:background var(--ams-transition-fast), color var(--ams-transition-fast); font-size:var(--ams-text-sm); font-family:var(--ams-font-body);"
              onmouseenter="this.style.background='var(--ams-bg-hover)'" onmouseleave="if(!this.classList.contains('ams-nav-active'))this.style.background='transparent'">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="14" height="8" rx="1.5"/>
          <line x1="5.5" y1="5" x2="5.5" y2="13"/><line x1="8" y1="5" x2="8" y2="13"/>
          <line x1="10.5" y1="5" x2="10.5" y2="13"/><line x1="13" y1="5" x2="13" y2="13"/>
          <line x1="2" y1="9" x2="16" y2="9"/>
        </svg>
        <span>乐器音调</span>
      </button>
    </nav>

    <!-- Separator -->
    <div style="width:1px; height:18px; background:var(--ams-border-default);"></div>

    <!-- Transport Controls -->
    <div style="display:flex; align-items:center; gap:2px;">
      <!-- Rewind -->
      <button style="width:28px; height:28px; display:flex; align-items:center; justify-content:center; border:none; border-radius:var(--radius-sm); background:transparent; color:var(--ams-text-secondary); cursor:pointer; transition:background var(--ams-transition-fast), color var(--ams-transition-fast);"
              onmouseenter="this.style.background='var(--ams-bg-hover)';this.style.color='var(--ams-text-primary)'" onmouseleave="this.style.background='transparent';this.style.color='var(--ams-text-secondary)'" title="回到开头">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M2 2v10h2V7l5 4V3L4 7V2z"/></svg>
      </button>
      <!-- Previous -->
      <button style="width:28px; height:28px; display:flex; align-items:center; justify-content:center; border:none; border-radius:var(--radius-sm); background:transparent; color:var(--ams-text-secondary); cursor:pointer; transition:background var(--ams-transition-fast), color var(--ams-transition-fast);"
              onmouseenter="this.style.background='var(--ams-bg-hover)';this.style.color='var(--ams-text-primary)'" onmouseleave="this.style.background='transparent';this.style.color='var(--ams-text-secondary)'" title="上一标记">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M3 7l6-5v10z"/><rect x="1" y="2" width="2" height="10" rx="0.5"/></svg>
      </button>
      <!-- Play / Stop -->
      <button id="ams-play-btn" style="width:30px; height:30px; display:flex; align-items:center; justify-content:center; border:none; border-radius:var(--radius-md); background:var(--ams-brand-primary-muted); color:var(--ams-brand-primary); cursor:pointer; transition:background var(--ams-transition-fast); margin:0 2px;"
              onmouseenter="this.style.background='var(--ams-brand-primary-glow)'" onmouseleave="this.style.background='var(--ams-brand-primary-muted)'" title="播放/停止">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><polygon points="4,2 14,8 4,14"/></svg>
      </button>
      <!-- Next -->
      <button style="width:28px; height:28px; display:flex; align-items:center; justify-content:center; border:none; border-radius:var(--radius-sm); background:transparent; color:var(--ams-text-secondary); cursor:pointer; transition:background var(--ams-transition-fast), color var(--ams-transition-fast);"
              onmouseenter="this.style.background='var(--ams-bg-hover)';this.style.color='var(--ams-text-primary)'" onmouseleave="this.style.background='transparent';this.style.color='var(--ams-text-secondary)'" title="下一标记">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M11 7L5 2v10z"/><rect x="11" y="2" width="2" height="10" rx="0.5"/></svg>
      </button>
      <!-- Fast-forward -->
      <button style="width:28px; height:28px; display:flex; align-items:center; justify-content:center; border:none; border-radius:var(--radius-sm); background:transparent; color:var(--ams-text-secondary); cursor:pointer; transition:background var(--ams-transition-fast), color var(--ams-transition-fast);"
              onmouseenter="this.style.background='var(--ams-bg-hover)';this.style.color='var(--ams-text-primary)'" onmouseleave="this.style.background='transparent';this.style.color='var(--ams-text-secondary)'" title="快进到结尾">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M12 2v10h-2V7L5 11V3l5 4V2z"/></svg>
      </button>
    </div>

    <!-- Separator -->
    <div style="width:1px; height:18px; background:var(--ams-border-default);"></div>

    <!-- Time / BPM / Key / Time Sig -->
    <div style="display:flex; align-items:center; gap:var(--ams-space-3);">
      <span style="font-family:var(--ams-font-mono); font-size:var(--ams-text-sm); color:var(--ams-text-primary); background:var(--ams-bg-tertiary); padding:2px 8px; border-radius:var(--radius-sm); border:1px solid var(--ams-border-subtle); letter-spacing:0.04em;">00:00:00.000</span>
      <div style="display:flex; align-items:center; gap:4px;">
        <span style="font-family:var(--ams-font-mono); font-size:var(--ams-text-xs); color:var(--ams-accent-warm); letter-spacing:0.03em;">120</span>
        <span style="font-family:var(--ams-font-body); font-size:var(--ams-text-xs); color:var(--ams-text-tertiary);">BPM</span>
      </div>
      <span style="font-family:var(--ams-font-body); font-size:var(--ams-text-xs); color:var(--ams-text-secondary); background:var(--ams-bg-tertiary); padding:2px 6px; border-radius:var(--radius-sm); border:1px solid var(--ams-border-subtle);">C Maj</span>
      <span style="font-family:var(--ams-font-body); font-size:var(--ams-text-xs); color:var(--ams-text-secondary); background:var(--ams-bg-tertiary); padding:2px 6px; border-radius:var(--radius-sm); border:1px solid var(--ams-border-subtle);">4/4</span>
    </div>

    <!-- Spacer -->
    <div style="flex:1;"></div>

    <!-- Right: Zoom / Snap / Undo-Redo / Metronome -->
    <div style="display:flex; align-items:center; gap:var(--ams-space-2);">
      <!-- Zoom -->
      <div style="display:flex; align-items:center; gap:4px;">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="var(--ams-text-tertiary)" stroke-width="1.3" stroke-linecap="round"><line x1="6" y1="2" x2="6" y2="12"/><line x1="2" y1="6" x2="12" y2="6"/><circle cx="6" cy="6" r="5"/></svg>
        <input type="range" min="25" max="400" value="100" style="width:60px; height:4px; accent-color:var(--ams-brand-primary); cursor:pointer;" title="缩放">
      </div>
      <div style="width:1px; height:18px; background:var(--ams-border-default);"></div>
      <!-- Snap -->
      <button id="ams-snap-btn" style="width:28px; height:28px; display:flex; align-items:center; justify-content:center; border:none; border-radius:var(--radius-sm); background:var(--ams-bg-tertiary); color:var(--ams-brand-primary); cursor:pointer; transition:background var(--ams-transition-fast);"
              onmouseenter="this.style.background='var(--ams-bg-hover)'" onmouseleave="this.style.background='var(--ams-bg-tertiary)'" title="吸附网格">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <rect x="1.5" y="1.5" width="11" height="11" rx="1"/><line x1="5.5" y1="1.5" x2="5.5" y2="12.5"/><line x1="9.5" y1="1.5" x2="9.5" y2="12.5"/><line x1="1.5" y1="5.5" x2="12.5" y2="5.5"/><line x1="1.5" y1="9.5" x2="12.5" y2="9.5"/>
        </svg>
      </button>

                  onmouseenter="this.style.background='var(--ams-brand-primary-glow)'" onmouseleave="this.style.background='var(--ams-brand-primary-muted)'">无</button>
          <button style="height:26px; padding:0 8px; border:none; border-radius:var(--radius-sm); background:var(--ams-bg-tertiary); color:var(--ams-text-secondary); cursor:pointer; font-size:var(--ams-text-xs); font-family:var(--ams-font-mono); font-weight:var(--ams-weight-semibold); transition:background var(--ams-transition-fast), color var(--ams-transition-fast);"
                  onmouseenter="this.style.background='var(--ams-bg-hover)';this.style.color='var(--ams-text-primary)'" onmouseleave="this.style.background='var(--ams-bg-tertiary)';this.style.color='var(--ams-text-secondary)'">#</button>
          <button style="height:26px; padding:0 8px; border:none; border-radius:var(--radius-sm); background:var(--ams-bg-tertiary); color:var(--ams-text-secondary); cursor:pointer; font-size:var(--ams-text-xs); font-family:var(--ams-font-body); font-weight:var(--ams-weight-semibold); transition:background var(--ams-transition-fast), color var(--ams-transition-fast);"
                  onmouseenter="this.style.background='var(--ams-bg-hover)';this.style.color='var(--ams-text-primary)'" onmouseleave="this.style.background='var(--ams-bg-tertiary)';this.style.color='var(--ams-text-secondary)'">&#9837;</button>
          <button style="height:26px; padding:0 8px; border:none; border-radius:var(--radius-sm); background:var(--ams-bg-tertiary); color:var(--ams-text-secondary); cursor:pointer; font-size:var(--ams-text-xs); font-family:var(--ams-font-mono); transition:background var(--ams-transition-fast), color var(--ams-transition-fast);"

        </div>
      </div>

  </main>

      <div style="display:flex; align-items:center; gap:4px;">
        <span style="width:6px; height:6px; border-radius:var(--radius-full); background:var(--state-success);"></span>
        <span style="font-family:var(--ams-font-mono);">WASAPI</span>
      </div>
    </div>
  </footer>

</div>

<!-- ========== Shell JS: Nav activation + tooltip behaviour ========== -->
<script>
(function() {
  function setActiveNav(key) {
    document.querySelectorAll('.ams-nav-btn').forEach(function(btn) {
      btn.classList.remove('ams-nav-active');
      btn.style.background = 'transparent';
      btn.style.color = 'var(--ams-text-tertiary)';
    });
    var target = document.querySelector('.ams-nav-btn[data-nav-key="' + key + '"]');
    if (target) {
      target.classList.add('ams-nav-active');
      target.style.background = 'var(--ams-brand-primary-muted)';
      target.style.color = 'var(--ams-brand-primary)';
    }
  }

  document.querySelectorAll('.ams-nav-btn').forEach(function(btn) {
    var tip = btn.querySelector('.ams-nav-tip');
    if (!tip) return;
    btn.addEventListener('mouseenter', function() { tip.style.opacity = '1'; });
    btn.addEventListener('mouseleave', function() { tip.style.opacity = '0'; });
  });

  document.querySelectorAll('.ams-nav-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var key = btn.getAttribute('data-nav-key');
      if (key) setActiveNav(key);
    });
  });

  window.amsSetActiveNav = setActiveNav;
})();
</script>
